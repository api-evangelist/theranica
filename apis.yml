aid: theranica
name: Theranica
description: >-
  Theranica Bio-Electronics is a digital therapeutics company developing
  prescription-grade wearable neuromodulation devices for prevalent neurological
  pain conditions. Its flagship product, Nerivio, is an FDA-authorized wireless
  Remote Electrical Neuromodulation (REM) device worn on the upper arm for the
  acute and preventive treatment of migraine, with or without aura, in patients
  ages 12 and up. Nerivio is controlled by a companion iOS and Android smartphone
  app that lets patients start treatments, adjust stimulation intensity, monitor
  session duration, and keep a shareable migraine diary. Theranica is a
  venture-backed medical device company; it does not currently publish a public
  developer API, SDK, or developer portal. This profile was surfaced as a
  portfolio company of Lightspeed Venture Partners and enriched by the API
  Evangelist pipeline.
